<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Peralta — Backend Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/style/ZenLoad.css">
</head>
<body>

    <nav class="zen-nav">
        <span class="nav-logo">DP</span>
        <ul class="nav-links">
            <li><a href="#home" class="nav-link active">home</a></li>
            <li><a href="#projects-featured" class="nav-link">projects</a></li>
            <li><a href="#about" class="nav-link">about</a></li>
            <li><a href="#contact" class="nav-link">contact</a></li>
        </ul>
    </nav>

    <div class="zen-wrapper">
        <main class="zen-panel">

            <!-- Hero -->
            <section id="home" class="hero-section zen-section">
                <div class="hero-left">
                    <div class="profile-frame">
                        <img src="./src/img/profile.png" alt="David Peralta" class="profile-image">
                        <div class="profile-ring"></div>
                    </div>
                </div>
                <div class="hero-right">
                    <p class="hero-label">Backend Developer</p>
                    <h1 class="hero-name">David<br>Peralta</h1>
                    <p class="hero-bio" id="hero-bio"></p>
                    <div class="hero-stack" id="hero-stack"></div>
                    <a href="#projects-featured" class="cta-button">view projects <span class="cta-arrow">&#8595;</span></a>
                </div>
            </section>

            <div class="zen-divider"></div>

            <!-- Top Projects -->
            <section id="projects-featured" class="projects-section zen-section">
                <!-- populated by zen.js -->
            </section>

            <div class="zen-divider"></div>

            <!-- More Projects -->
            <section id="projects-all" class="projects-section zen-section">
                <!-- populated by zen.js -->
            </section>

            <div class="zen-divider"></div>

            <!-- About -->
            <section id="about" class="about-section zen-section">
                <div class="section-header">
                    <h2 class="section-title">About</h2>
                </div>
                <div class="about-content" id="about-content">
                    <!-- populated by zen.js -->
                </div>
            </section>

            <div class="zen-divider"></div>

            <!-- Contact -->
            <section id="contact" class="contact-section zen-section">
                <div class="section-header">
                    <h2 class="section-title">Get in Touch</h2>
                    <p class="section-subtitle">open to opportunities and collaboration</p>
                </div>
                <div class="contact-links" id="contact-links">
                    <!-- populated by zen.js -->
                </div>
            </section>

            <!-- Footer -->
            <footer class="zen-footer">
                <span>David Peralta &copy; 2026</span>
                <span class="footer-dot">&middot;</span>
                <span>Built with intention</span>
            </footer>

        </main>
    </div>

    <script src="./src/module/ZenMode.js"></script>
    <script src="./src/module/Project.js"></script>
</body>
</html>
